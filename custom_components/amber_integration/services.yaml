    source:
      name: Source
      description: >
        Identifies the caller ("manual", "auto_buy", "auto_sell", ...). Used
        to track ownership of the active override, so the auto_sell/auto_buy
        automation blueprints only ever cancel an override they applied
        themselves - not one from a manual toggle or from each other.
        Defaults to "service" if not set.
      default: service
      selector:
        text:

consume:
  name: Self consumption
  description: Hold the battery in self consumption, neither charging nor discharging from the grid.
  fields:
    duration:
      name: Duration
      description: How long to hold the override, in minutes.
      default: 60
      selector:
        number:
          min: 1
          max: 1440
          unit_of_measurement: min
    source:
      name: Source
      description: >
        Identifies the caller ("manual", "auto_buy", "auto_sell", ...). Used
