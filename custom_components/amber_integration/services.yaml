force_charge:
  name: Force charge
  description: >
    Charge the battery from the grid. Skips the API call if the same override
    is already running with more than 7 minutes left.
  fields:
    duration:
      name: Duration
      description: How long to hold the override, in minutes.
      default: 60
      selector:
        number:
          min: 1
          max: 1440
          unit_of_measurement: min
    source:
      name: Source
      description: >
        Identifies the caller ("manual", "auto_buy", "auto_sell", ...). Used
        to track ownership of the active override, so the auto_sell/auto_buy
        automation blueprints only ever cancel an override they applied
        themselves - not one from a manual toggle or from each other.
        Defaults to "service" if not set.
      default: service
      selector:
        text:

force_discharge:
  name: Force discharge
  description: >
    Discharge the battery to the grid. Skips the API call if the same override
    is already running with more than 7 minutes left.
  fields:
    duration:
      name: Duration
      description: How long to hold the override, in minutes.
      default: 60
      selector:
        number:
          min: 1
          max: 1440
          unit_of_measurement: min
    source:
      name: Source
      description: >
        Identifies the caller ("manual", "auto_buy", "auto_sell", ...). Used
        to track ownership of the active override, so the auto_sell/auto_buy
        automation blueprints only ever cancel an override they applied
        themselves - not one from a manual toggle or from each other.
        Defaults to "service" if not set.
      default: service
      selector:
        text:

preserve_charge:
  name: Preserve charge
  description: Hold the current charge, neither charging nor discharging.
  fields:
    duration:
      name: Duration
      description: How long to hold the override, in minutes.
      default: 60
      selector:
