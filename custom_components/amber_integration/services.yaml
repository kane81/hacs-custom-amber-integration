        automation blueprints only ever cancel an override they applied
        themselves - not one from a manual toggle or from each other.
        Defaults to "service" if not set.
      default: service
      selector:
        text:

cancel_override:
  name: Cancel override
  description: Cancel any active battery override and return control to Smart Shift.

smartshift_on:
  name: Enable Smart Shift
  description: Enable Amber Smart Shift optimisation. Required for overrides to take effect.
  fields:
    source:
      name: Source
      description: >
        Identifies the caller ("manual", "auto_disable_smart_shift_when_idle",
        ...). The Auto Disable Smart Shift When Idle blueprint uses this to
        tell "I turned Smart Shift off, so I should be the one to turn it
        back on" apart from "Smart Shift happens to be off for some other
        reason" - it only re-enables Smart Shift if it was the one that
        disabled it. Defaults to "service" if not set.
      default: service
      selector:
        text:

smartshift_off:
  name: Disable Smart Shift
  description: >
    Disable Amber Smart Shift optimisation, so the Smart Shift plan stops
    dispatching the battery.
  fields:
    source:
      name: Source
      description: >
        Identifies the caller. See smartshift_on for what this is used for.
        Defaults to "service" if not set.
      default: service
      selector:
        text:

refresh:
  name: Refresh
  description: Poll Amber immediately instead of waiting for the next update.
